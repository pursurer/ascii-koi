<!doctype html>
<html lang="en" data-theme="pond">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Koi</title>
<meta name="description" content="A living ASCII koi pond for your new tab. Click: a cat paw scoops the water. Right-click: feed the koi. Pond, black and light water.">
<meta property="og:title" content="ASCII Koi">
<meta property="og:description" content="A koi pond drawn in text characters. Click: a cat paw scoops. Right-click: feed the koi.">
<meta property="og:image" content="https://pursurer.github.io/ascii-koi/media/poster.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e2a32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/noto-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="pond.css">
</head>
<body>
<canvas id="pond" aria-hidden="true"></canvas>
<div class="intro">
  <div class="intro-box" id="intro-box">
    <h1 class="sr" id="sr-title">ASCII Koi</h1>
    <canvas class="wordmark" id="wordmark" aria-hidden="true"></canvas>
    <canvas class="wordmark-tag" id="wordmark-tag" aria-hidden="true"></canvas>
    <p class="intro-line" id="intro-date"></p>
  </div>
</div>
<canvas id="snap" aria-hidden="true"></canvas>
<div class="ui" id="ui">
  <div class="themes" role="radiogroup" aria-label="Water">
    <button type="button" role="radio" data-theme-pick="pond">pond</button>
    <button type="button" role="radio" data-theme-pick="black">black</button>
    <button type="button" role="radio" data-theme-pick="light">light</button>
  </div>
  <p class="hint"><span class="mouse"><b>click</b> cat paw</span><span class="mouse"><b>right-click</b> feed</span><span class="touch"><b>tap</b> cat paw</span><span class="touch"><b>hold</b> feed</span><span class="desk"><b>1 2 3</b> water</span><span class="desk"><b>space</b> pause</span><span id="pause-state"></span></p>
  <a id="gh" href="https://github.com/pursurer/ascii-koi" target="_blank" rel="noopener">★ github</a>
</div>
<script src="pond.js"></script>
<script src="app.js"></script>
</body>
</html>
